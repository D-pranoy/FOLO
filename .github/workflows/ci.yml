# CI v0 (RB-01 step 9 and 10, ADR-0019): Python and Rust checks on Windows
# and Linux, cargo-deny, the contract checks (RB-02 step 6), the packaging
# smoke tests and the Linux capture backend's tests (RB-14, ADR-0037 D22).
# Actions are pinned by commit (the comment gives the release); the token is
# read-only.
name: CI

on:
  pull_request:
  push:
    branches: [v1, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.13.0'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: PulseAudio server and dbus-daemon for the Linux capture and MPRIS tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils dbus
          pulseaudio --daemonize=yes --exit-idle-time=-1
          pactl info
          dbus-daemon --version
          echo "FOLO_PULSE_TESTS=1" >> "$GITHUB_ENV"
          echo "FOLO_DBUS_TESTS=1" >> "$GITHUB_ENV"
      - name: Tests (goldens, beat fixtures, sanitize_config, the studio starting, Linux capture and MPRIS)
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the effect engine's version from the tags
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: The effect engine on the PATH, for the node's end-to-end test (RB-06)
        run: |
          uv sync --locked
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
          echo "FOLO_E2E=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The live messages the node sent in its tests against AsyncAPI (RB-07 step 7)
        run: uv run python scripts/conformance.py messages target/tmp/live-messages

  # The Linux capture backend needs PipeWire 1.0's development files to build
  # (Ubuntu 24.04 has them, 22.04's 0.3.48 is too old for the `pipewire` crate),
  # so it is a feature that the Ubuntu 22.04 jobs above leave off: they still
  # build the whole workspace. Here the feature is on, and its tests run against
  # a real PipeWire daemon and a fake ScreenCast portal on a private session bus.
  capture-linux:
    name: Linux capture (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: PipeWire, its session manager, dbus-daemon and the headers to build against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pipewire wireplumber dbus-daemon libpipewire-0.3-dev libspa-0.2-dev libclang-dev pkg-config
          pipewire --version
          dbus-daemon --version
          echo "FOLO_PIPEWIRE_TESTS=1" >> "$GITHUB_ENV"
      - run: cargo clippy -p folo-capture-core -p folo-capture-linux -p folo-capture --all-targets --all-features --locked -- -D warnings
      - name: Tests (the portal backend against a fake portal and a real PipeWire daemon)
        run: cargo test -p folo-capture-core -p folo-capture-linux -p folo-capture --all-features --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  contracts:
    name: Contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI's contract tools (openapi-typescript, AsyncAPI parser, TypeScript)
        run: npm ci
        working-directory: ui
      - name: Validate the schemas, OpenAPI and AsyncAPI; fail on drift of generated code
        run: uv run python scripts/contracts.py check
      - name: The generated TypeScript types build (strict tsc)
        run: npm run check:types
        working-directory: ui
      - name: Message fixtures against AsyncAPI
        run: uv run python scripts/conformance.py messages
      - name: The client API against OpenAPI, on a node of its own (RB-07 step 7)
        run: |
          cargo build --locked -p folo-node
          uv run python scripts/conformance.py api --node target/debug/folo

  package-studio:
    name: Frozen studio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group packaging
      - name: PyInstaller one-dir build
        run: uv run pyinstaller --noconfirm packaging/folo-studio.spec
      - name: Smoke test
        run: ./dist/folo-studio/folo-studio --help

  package-node:
    name: folo binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/folo --version
