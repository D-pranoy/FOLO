[package]
name = "folo-capture"
description = "The display capture agent, binary `folo-capture`: run and screens --json (RB-14, ADR-0037)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "folo-capture"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
folo-capture-core = { path = "../folo-capture-core" }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[features]
# The Linux portal backend (`--backend portal`, and `auto` on Linux). It needs
# PipeWire 1.0's development files to build, so it is off by default.
portal = ["folo-capture-linux/portal"]

[target.'cfg(target_os = "linux")'.dependencies]
folo-capture-linux = { path = "../folo-capture-linux" }
