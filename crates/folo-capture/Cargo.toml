[package]
name = "folo-capture"
description = "The display capture agent, binary `folo-capture`: run and screens --json (RB-14, ADR-0037)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "folo-capture"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
folo-capture-core = { path = "../folo-capture-core" }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
