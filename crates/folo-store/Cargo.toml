[package]
name = "folo-store"
description = "The node's documents: clamped, versioned JSON with atomic, debounced writes, and secrets.json with owner-only permissions (RB-06 step 4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
folo-protocol = { path = "../folo-protocol" }
getrandom = { version = "0.3", features = ["std"] }
log = "0.4"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
