[package]
name = "folo-provider-hue"
description = "The Philips Hue provider: pairing, entertainment streaming and administration (RB-13, ADR-0013)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
folo-protocol = { path = "../folo-protocol" }
folo-provider = { path = "../folo-provider" }
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
log = "0.4"
mdns-sd = { version = "0.21", default-features = false }
# The DTLS stream (RB-13 step 5) and the certificate checks of the REST client
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# Windows has no system OpenSSL (the run book vendors it)
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
