# cargo-deny: licences, advisories, bans and sources of the Rust dependencies
# (RB-01 step 2, ADR-0019 D5). FOLO is MIT; dependencies must allow that
# (ADR-0023 D4). Adding a licence here is a decision: say why in the pull request.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `ashpd` (the portal wrapper RB-14 names, ADR-0037) is on zbus 5, whose
# `zvariant`, `zvariant_derive` and `zbus_names` crates were folded into zbus 6.
# These are notices of unmaintained crates, not vulnerabilities. Drop them when
# `ashpd` moves to zbus 6.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant is merged into zbus 6; ashpd 0.13 still uses zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is merged into zbus 6; ashpd 0.13 still uses zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is merged into zbus 6; ashpd 0.13 still uses zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
