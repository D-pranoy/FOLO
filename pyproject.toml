[build-system]
requires = ["hatchling>=1.32", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "folo-source"
dynamic = ["version"]
description = "FOLO's effect engine. The legacy FOLO studio (studio.py) runs on it until M3 and M4 replace it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FOLO contributors" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.5",
  "pydantic>=2.14",     # the models generated from specs/schema (folo_source/contracts)
  # The local link to the node (folo_source/publish, ADR-0032)
  "websockets>=15",
  "lz4>=4.4",
  # The WASAPI capture (folo_source/inputs/audio/windows); elsewhere capture is unavailable
  "cffi>=2.1; sys_platform == 'win32'",
  # Now playing: Windows' media sessions (folo_source/inputs/media/windows.py)
  "winrt-runtime>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
]

[project.scripts]
folo-source = "folo_source.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "hypothesis>=6.169",
  "pytest-cov>=7.1",
  "ruff>=0.17",
  "pyright>=1.1.414",
  "pre-commit>=4.7",
  # Contracts (RB-02): code generation, schema and API validation, conformance
  "datamodel-code-generator>=0.83",
  "jsonschema>=4.26",
  "openapi-spec-validator>=0.9",
  "pyyaml>=6",
  "schemathesis>=4.31",
]
packaging = ["pyinstaller>=6.22"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only FOLO's own release tags (v<semver>) count. The pattern also matches
# v0.9.0-legacy, which isn't a PEP 440 version. Upstream's old tags aren't
# excluded by name: clones don't fetch them (ADR-0019, CONTRIBUTING.md).
git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long",
  "--match", "v[0-9]*.[0-9]*.[0-9]*", "--exclude", "*-legacy",
]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["source/folo_source"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "source"]
# Generated by scripts/contracts.py
extend-exclude = ["source/folo_source/contracts/models.py"]
force-exclude = true  # also when pre-commit passes the files

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"studio.py" = ["E402"]  # the package imports follow the sys.path setup
"source/folo_source/inputs/audio/windows/wasapi.py" = ["E501"]  # C declarations for cffi, one per line

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.13"
# The studio runs on Windows: check it as Windows code on every CI runner
pythonPlatform = "Windows"
typeCheckingMode = "basic"
include = ["studio.py", "source", "scripts", "tests"]
extraPaths = ["source"]
exclude = ["**/__pycache__"]
# New modules are checked strictly
strict = [
  "scripts",
  "tests",
  "source/folo_source/contracts",
  "source/folo_source/runtime/lifecycle.py",
  "source/folo_source/runtime/logs.py",
  "source/folo_source/core.py",
  "source/folo_source/inputs/base.py",
  "source/folo_source/inputs/audio/input.py",
  "source/folo_source/inputs/media/input.py",
  "source/folo_source/inputs/generator.py",
  "source/folo_source/inputs/screen.py",
  "source/folo_source/inputs/listing.py",
  "source/folo_source/effects/base.py",
  "source/folo_source/effects/post.py",
  "source/folo_source/surfaces",
  "source/folo_source/publish",
  "source/folo_source/cli.py",
  "source/folo_source/runtime/executor.py",
  "source/folo_source/runtime/source.py",
  "source/folo_source/legacy/renderer.py",
  "source/folo_source/legacy/migrate.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.codespell]
# Generated files: `*path` globs match both a walk from the root (./path) and
# the plain paths pre-commit passes
skip = "./tests/golden,./tests/corpus,./target,./.venv,./ui/node_modules,*.lock,*.png,*specs/generated/*,*specs/fixtures/*,*folo_source/contracts/models.py,*crates/folo-protocol/src/generated.rs,*crates/folo-protocol/src/v1/pyunicode.rs,*ui/src/lib/api/schema.ts,*ui/package-lock.json"
# kno: WLED's docs domain (kno.wled.ge); emptyY: a variable in web/studio.js; datas: PyInstaller's API
ignore-words-list = "kno,emptyy,datas"

[tool.coverage.run]
source = ["folo_source", "studio"]
